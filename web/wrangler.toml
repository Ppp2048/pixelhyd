# Cloudflare Pages: the site (dist) plus the visit counter function (functions/api/visits.ts).
# The tiles are part of the build too, cut into chunk files (npm run build:deploy; see docs/deploy.md).
name = "pixelhyd"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "pixelhyd-visits"
# Printed by `npx wrangler@4.156.0 d1 create pixelhyd-visits`. An identifier, not a secret.
database_id = "1c660b37-7b06-4716-a478-1d23b5947878"
migrations_dir = "migrations"
