[project]
name = "hitec-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jeetain Saini", email = "jeetainsaini@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "overturemaps>=2.1.1",
    "pillow>=13.0.0",
    "pmtiles>=3.8.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[project.scripts]
hitec-pipeline = "hitec_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
